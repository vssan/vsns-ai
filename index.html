<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VsnS AI</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:Arial;color:#172033}.app{max-width:820px;margin:30px auto;background:white;padding:28px;border-radius:24px;box-shadow:0 12px 40px #0002}.brand{text-align:center}.brand h1{font-size:46px;margin:0}.brand .ai{font-weight:400}.brand p{color:#667085}.welcome{text-align:center;font-size:20px;margin:24px}.chat{height:420px;overflow:auto;border:1px solid #e1e6ef;border-radius:16px;padding:18px;background:#fafbfc}.msg{line-height:1.5}.input{display:flex;gap:10px;margin-top:14px}.input input{flex:1;padding:15px;border:1px solid #ccd3df;border-radius:14px;font-size:16px}.input button{border:0;border-radius:14px;padding:0 22px;background:#172033;color:white;font-size:16px}</style></head><body><main class="app"><div class="brand"><h1>VsnS <span class="ai">AI</span></h1><p>Seu assistente inteligente</p></div><div class="welcome">Olá! Eu sou a VsnS AI. Como posso ajudar?</div><div id="chat" class="chat"><p class="msg">👋 Minha base inicial de dimensionamento solar está carregada.</p><p class="msg">Teste perguntas como: “Como dimensionar um sistema para 800 kWh/mês?”</p></div><div class="input"><input id="m" placeholder="Digite sua pergunta..."><button onclick="send()">Enviar</button></div></main>
<script>
const kb=[
["dimensionar,dimensionamento,quantos modulos","Para dimensionar um sistema fotovoltaico, avalio consumo em kWh, localização, irradiação/HSP, orientação, inclinação, perdas, potência dos módulos, inversores, strings, área, sombreamento e limites elétricos. O cálculo final precisa validar todos esses pontos."],
["800 kwh,800 kwh/mês","800 kWh/mês equivalem a cerca de 26,7 kWh/dia. Uma estimativa inicial usa potência FV ≈ consumo diário ÷ (HSP × rendimento global). O valor final depende da localização, período, perdas e características do sistema."],
["hsp,horas de sol,irradiação","HSP representa a energia solar diária equivalente em kWh/m²/dia. Deve ser escolhida de acordo com a localização e o período de análise; não existe uma HSP única para todo o Brasil."],
["perdas,performance ratio","Considere temperatura, sujeira, mismatch, cabos CC/CA, conversão do inversor, disponibilidade e sombreamento. O ideal é separar as perdas relevantes em vez de aplicar uma porcentagem arbitrária."],
["modulo,placa,painel","A quantidade de módulos depende da potência DC desejada e da potência unitária. Depois é necessário validar quantidade de módulos por string, tensão, corrente, área e compatibilidade com o inversor."],
["inversor,inversores","Verifique potência AC, faixa MPPT, tensão máxima, corrente máxima por MPPT, número de MPPTs, tensão de partida, relação DC/AC e requisitos da distribuidora."],
["string,strings,mppt","As strings precisam ficar dentro da faixa MPPT e do limite máximo de tensão do inversor, inclusive considerando temperatura. A corrente também precisa respeitar os limites de entrada."],
["sombreamento,sombra","Sombreamento deve ser analisado por horário e época do ano. Obstáculos, espaçamento, orientação e arquitetura elétrica podem alterar bastante a geração."],
["orientação,norte,azimute,inclinação","Norte costuma ser referência no Brasil para geração anual, mas outras orientações podem ser viáveis. A decisão depende do telhado, consumo, área e perfil de geração."],
["consumo,conta de energia,kwh","O histórico de consumo é a base. Avalie sazonalidade, mudanças previstas de carga, modalidade tarifária e características da fatura."],
["bateria,hibrido,híbrido","Bateria não é dimensionada apenas pelo consumo mensal. É preciso considerar cargas de backup, potência, autonomia, profundidade de descarga e eficiência."],
["cabos,cabo,queda de tensão","Dimensione cabos considerando corrente, comprimento, método de instalação, temperatura, capacidade de condução e queda de tensão, separando CC e CA."],
["homologação,concessionaria,distribuidora","A documentação e os requisitos dependem da distribuidora e da modalidade do sistema. O projeto deve seguir os requisitos técnicos vigentes."],
["area,área,telhado,espaço","Compare a área disponível com dimensões dos módulos, espaçamentos, obstáculos, acesso para manutenção e organização das strings."]
];
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function reply(q){q=norm(q);let best=null,score=0;for(const [keys,a] of kb){let s=0;for(const k of keys.split(","))if(q.includes(norm(k)))s+=1;if(s>score){score=s;best=a}}return best||"Ainda não tenho uma resposta específica para essa pergunta nesta base. Esse é justamente o tipo de teste que vamos usar para melhorar a VsnS AI: você me diz como gostaria que a resposta fosse, e vamos transformar isso em conhecimento da IA."}
function send(){let i=document.getElementById("m"),t=i.value.trim(),c=document.getElementById("chat");if(!t)return;c.innerHTML+=`<p class="msg"><b>Você:</b> ${esc(t)}</p><p class="msg"><b>VsnS AI:</b> ${esc(reply(t))}</p>`;i.value="";i.focus();c.scrollTop=c.scrollHeight}
function esc(s){let d=document.createElement("div");d.textContent=s;return d.innerHTML}document.getElementById("m").onkeydown=e=>{if(e.key==="Enter")send()}
</script></body></html>
