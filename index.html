<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VSNS AI</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: Arial, sans-serif; background: #f4f7fb; color: #172033;
  }
  .app {
    width: min(720px, 92vw); background: white; border-radius: 24px;
    box-shadow: 0 12px 40px rgba(0,0,0,.10); padding: 34px;
  }
  .brand { text-align: center; margin-bottom: 30px; }
  .brand h1 { margin: 0; font-size: 42px; letter-spacing: 2px; }
  .brand h1 span { font-weight: 400; }
  .brand p { margin: 8px 0 0; color: #667085; }
  .welcome { text-align: center; font-size: 21px; margin: 30px 0; }
  .chat {
    min-height: 120px; border: 1px solid #e1e6ef; border-radius: 16px;
    padding: 18px; margin-bottom: 16px; background: #fafbfc;
  }
  .msg { margin: 0 0 12px; }
  .msg:last-child { margin-bottom: 0; }
  .you { font-weight: 700; }
  .input-row { display: flex; gap: 10px; }
  input {
    flex: 1; padding: 15px 16px; border: 1px solid #ccd3df; border-radius: 14px;
    font-size: 16px; outline: none;
  }
  input:focus { border-color: #6b7cff; }
  button {
    border: 0; border-radius: 14px; padding: 0 22px; font-size: 16px;
    cursor: pointer; background: #172033; color: white;
  }
  button:hover { opacity: .9; }
  .footer { text-align: center; color: #98a2b3; font-size: 12px; margin-top: 22px; }
</style>
</head>
<body>
  <main class="app">
    <div class="brand">
      <h1>VSNS <span>AI</span></h1>
      <p>Seu assistente inteligente</p>
    </div>

    <div class="welcome">Olá! Eu sou a VSNS AI. Como posso ajudar?</div>

    <div class="chat" id="chat">
      <p class="msg">👋 Estou pronta para conversar com você.</p>
    </div>

    <div class="input-row">
      <input id="message" type="text" placeholder="Digite sua mensagem..." autocomplete="off">
      <button onclick="sendMessage()">Enviar</button>
    </div>

    <div class="footer">Protótipo inicial • VSNS AI</div>
  </main>

<script>
function sendMessage() {
  const input = document.getElementById('message');
  const chat = document.getElementById('chat');
  const text = input.value.trim();
  if (!text) return;

  const you = document.createElement('p');
  you.className = 'msg';
  you.innerHTML = '<span class="you">Você:</span> ' + escapeHtml(text);
  chat.appendChild(you);

  const ai = document.createElement('p');
  ai.className = 'msg';
  ai.innerHTML = '<strong>VSNS AI:</strong> Recebi sua mensagem. Em breve vamos conectar minha inteligência de verdade aqui. 🚀';
  chat.appendChild(ai);

  input.value = '';
  input.focus();
  chat.scrollTop = chat.scrollHeight;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

document.getElementById('message').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') sendMessage();
});
</script>
</body>
</html>
